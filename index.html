<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taman Persahabatan: Kuis Persahabatan Positif</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --secondary: #2ecc71;
            --dark: #2c3e50;
            --card-bg: #ffffff;
            --shadow: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #4b5563;
            font-size: 1rem;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 30px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #1e293b;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .option-btn.selected {
            background: #e0f2fe;
            border-color: var(--primary);
            font-weight: bold;
        }

        .quiz-controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 20px;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .score-circle span {
            font-size: 0.9rem;
            font-weight: normal;
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 15px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .question-box {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Taman Persahabatan 🌸</h1>
        <p class="subtitle">Kuis Evaluasi Persahabatan Positif & Dinamika Sosial</p>
    </header>

    <div class="main-container">
        <!-- QUIZ BODY -->
        <div id="quiz-body">
            <div class="quiz-header">
                <span id="question-count" style="font-weight: bold; color: #64748b;">Soal 1 dari 30</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="question-box" id="question-text">
                Memuat pertanyaan...
            </div>

            <div class="options-container" id="options-container">
                <!-- Opsi jawaban -->
            </div>

            <div class="quiz-controls">
                <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Selanjutnya</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="result-screen" style="display: none;">
            <h2>Hasil Kuis Kamu!</h2>
            <div class="score-circle">
                <div id="final-score">0</div>
                <span>/ 30 Soal Benar</span>
            </div>
            <p id="result-message" style="font-size: 1.1rem; margin-bottom: 25px; color: #475569;"></p>
            <button class="btn" onclick="restartQuiz()">Ulangi Kuis</button>
        </div>
    </div>
